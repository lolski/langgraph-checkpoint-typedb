[project]
name = "langgraph-checkpoint-typedb"
version = "0.1.0"
description = "LangGraph BaseCheckpointSaver implementation backed by TypeDB 3.x"
authors = [
    {name = "Ganeshwara Hananda", email = "ganesh@typedb.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph-checkpoint (>=2.0,<5.0)",
    "typedb-driver (>=3.8,<4.0.0)"
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<10.0.0"
pytest-asyncio = ">=0.23"
testcontainers = ">=4.7"
ruff = ">=0.6"
mypy = ">=1.10"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
